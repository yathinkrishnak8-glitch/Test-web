<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Racer V1 - Open World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 15px;
            border: 2px solid #0f0;
            line-height: 1.8;
            width: 280px;
        }

        #minimap {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 180px;
            height: 180px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #0f0;
            canvas {
                width: 100%;
                height: 100%;
            }
        }

        #gameStatus {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 40px;
            border: 3px solid #0f0;
            font-size: 24px;
            text-align: center;
            min-width: 400px;
            display: none;
            z-index: 1000;
        }

        #gameStatus h1 {
            color: #0f0;
            margin-bottom: 20px;
        }

        #gameStatus button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }

        #gameStatus button:hover {
            background: #00ff00;
        }

        #speedometer {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #0f0;
            padding: 15px;
            color: #0f0;
            font-family: monospace;
            font-size: 14px;
        }

        #modeSelector {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            border: 2px solid #0f0;
            padding: 15px;
            font-size: 12px;
        }

        #modeSelector button {
            background: rgba(0, 255, 0, 0.2);
            color: #0f0;
            border: 1px solid #0f0;
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
            font-family: monospace;
        }

        #modeSelector button.active {
            background: #0f0;
            color: #000;
        }

        #raceTimer {
            position: fixed;
            top: 50px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #ff0000;
            border: 2px solid #ff0000;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            display: none;
            z-index: 100;
        }

        .info-panel {
            position: fixed;
            bottom: 220px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            border: 2px solid #0f0;
            padding: 15px;
            font-family: monospace;
            font-size: 11px;
            display: none;
            max-width: 250px;
        }
    </style>
</head>
<body>
    <div id="hud"></div>
    <div id="minimap"><canvas id="minimapCanvas"></canvas></div>
    <div id="speedometer"></div>
    <div id="modeSelector">
        <div style="margin-bottom: 10px;"><b>MODE</b></div>
        <button id="modeFreeroam" class="active">FREE ROAM</button>
        <button id="modeRace">RACE</button>
        <button id="modeDrift">DRIFT</button>
        <button id="modeTimeTrial">TIME TRIAL</button>
    </div>
    <div id="raceTimer"></div>
    <div class="info-panel" id="raceInfo"></div>
    <div id="gameStatus">
        <h1 id="statusTitle">RACE COMPLETE</h1>
        <div id="statusText"></div>
        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Physics Engine (Embedded) -->
    <script>
class VehiclePhysics {
  constructor(vehicleRoot, chassisRoot, config = {}) {
    this.vehicleRoot = vehicleRoot;
    this.chassisRoot = chassisRoot;

    this.velocity = new THREE.Vector3(0, 0, 0);
    this.angularVelocity = new THREE.Vector3(0, 0, 0);
    this.position = new THREE.Vector3(0, 0, 0);
    this.yaw = 0;

    this.currentGear = 0;
    this.rpm = 0;
    this.nitroFuel = 100;
    this.nitroActive = false;
    this.enginePower = 350;

    this.wheelHeights = [0, 0, 0, 0];
    this.groundContact = false;
    this.airborneTime = 0;

    this.isDrifting = false;
    this.driftAngle = 0;
    this.driftPoints = 0;
    this.driftMultiplier = 1.0;

    this.mass = config.mass ?? 1300;
    this.brakeTorque = config.brakeTorque ?? 5000;
    this.wheelRadius = config.wheelRadius ?? 0.34;
    this.dragCoeff = config.dragCoeff ?? 0.95;
    this.rollResistance = config.rollResistance ?? 0.015;

    this.suspensionK = config.suspensionK ?? 25000;
    this.suspensionC = config.suspensionC ?? 2500;
    this.suspensionRest = config.suspensionRest ?? 0.4;
    this.suspensionTravel = config.suspensionTravel ?? 0.3;

    this.staticFriction = config.staticFriction ?? 1.4;
    this.dynamicFriction = config.dynamicFriction ?? 0.95;
    this.driftFriction = config.driftFriction ?? 0.7;
    this.tireStiffness = config.tireStiffness ?? 0.18;

    this.driftAssistStrength = config.driftAssistStrength ?? 0.4;
    this.driftThreshold = config.driftThreshold ?? 0.15;
    this.driftMinSpeed = config.driftMinSpeed ?? 8;

    this.gearRatios = [3.5, 0.08, 0.18, 0.35, 0.55, 0.8];
    this.shiftUpThreshold = 0.8;
    this.shiftDownThreshold = 0.3;

    this.nitroPowerMult = 1.9;
    this.nitroTopSpeedMult = 1.45;
    this.nitroFuelDrain = config.nitroFuelDrain ?? 35;
    this.nitroRechargeRate = config.nitroRechargeRate ?? 15;

    this.pitchSensitivity = config.pitchSensitivity ?? 0.35;
    this.rollSensitivity = config.rollSensitivity ?? 0.12;

    this.wheelbase = config.wheelbase ?? 2.7;
    this.trackWidth = config.trackWidth ?? 1.6;

    this.getGroundHeight = config.getGroundHeight ?? (() => 0);
    this.getRoadOffset = config.getRoadOffset ?? ((z) => ({ x: 0 }));
    this.roadWidth = config.roadWidth ?? 12;

    this.collisionEvents = [];
  }

  update(dt, inputs = {}) {
    const { throttle = 0, steering = 0, handbrake = false, nos = false } = inputs;

    const th = Math.max(-1, Math.min(1, throttle));
    const st = Math.max(-1, Math.min(1, steering));

    this.updateGroundContact();
    this.applySuspension(dt);
    this.applyGravity(dt);
    this.updateDrivetrain(th, nos, dt);
    this.updateTraction(th, st, handbrake, dt);
    this.updateDrift(st, dt);
    this.updateSteering(st, dt);
    this.updateWeightTransfer(th, st, dt);
    this.updatePosition(dt);
    this.checkRoadBoundaries();
    this.syncToThreeJS();
  }

  updateGroundContact() {
    const wheelPositions = [
      [-this.trackWidth / 2, -this.wheelbase / 2],
      [this.trackWidth / 2, -this.wheelbase / 2],
      [-this.trackWidth / 2, this.wheelbase / 2],
      [this.trackWidth / 2, this.wheelbase / 2],
    ];

    let minHeight = Infinity;
    let contactCount = 0;

    for (let i = 0; i < 4; i++) {
      const [xOff, zOff] = wheelPositions[i];
      const wx = this.position.x + xOff * Math.cos(this.yaw) - zOff * Math.sin(this.yaw);
      const wz = this.position.z + xOff * Math.sin(this.yaw) + zOff * Math.cos(this.yaw);

      const groundY = this.getGroundHeight(wx, wz);
      this.wheelHeights[i] = groundY;

      if (this.position.y - groundY < 0.5) {
        contactCount++;
      }
      minHeight = Math.min(minHeight, groundY);
    }

    this.groundContact = contactCount >= 2;
    const targetHeight = minHeight + 0.35;
    
    if (this.groundContact && this.position.y < targetHeight) {
      this.position.y = targetHeight;
      if (this.velocity.y < 0) this.velocity.y *= 0.3;
    }
  }

  applySuspension(dt) {
    if (!this.groundContact) return;

    const wheelPositions = [
      [-this.trackWidth / 2, -this.wheelbase / 2],
      [this.trackWidth / 2, -this.wheelbase / 2],
      [-this.trackWidth / 2, this.wheelbase / 2],
      [this.trackWidth / 2, this.wheelbase / 2],
    ];

    let totalForce = 0;

    for (let i = 0; i < 4; i++) {
      const [xOff, zOff] = wheelPositions[i];
      const wx = this.position.x + xOff * Math.cos(this.yaw) - zOff * Math.sin(this.yaw);
      const wz = this.position.z + xOff * Math.sin(this.yaw) + zOff * Math.cos(this.yaw);

      const groundY = this.wheelHeights[i];
      const chassisY = this.position.y;
      const compression = (chassisY - groundY) - this.suspensionRest;

      const springForce = -this.suspensionK * Math.max(0, compression);
      const damperForce = -this.suspensionC * this.velocity.y;
      const wheelForce = springForce + damperForce;

      totalForce += Math.max(0, wheelForce);
    }

    this.velocity.y += (totalForce / this.mass) * dt;
  }

  applyGravity(dt) {
    const g = 9.81;
    if (!this.groundContact) {
      this.velocity.y -= g * dt;
    }
    this.airborneTime = this.groundContact ? 0 : this.airborneTime + dt;
  }

  updateDrivetrain(throttle, nos, dt) {
    const maxRPM = 7000;
    const gearRatio = Math.abs(this.gearRatios[this.currentGear]);
    const speed = this.velocity.length();
    const wheelRPM = (speed / (Math.PI * 2 * this.wheelRadius)) * 60;
    const targetRPM = wheelRPM * gearRatio;

    this.rpm = this.rpm * 0.9 + targetRPM * 0.1;

    const rpmRatio = this.rpm / maxRPM;
    if (this.currentGear > 0 && this.currentGear < 5 && rpmRatio > this.shiftUpThreshold) {
      this.currentGear++;
    } else if (this.currentGear > 1 && rpmRatio < this.shiftDownThreshold) {
      this.currentGear--;
    }

    if (nos && this.nitroFuel > 0 && throttle > 0.3) {
      this.nitroActive = true;
      this.nitroFuel = Math.max(0, this.nitroFuel - this.nitroFuelDrain * dt);
    } else {
      this.nitroActive = false;
      this.nitroFuel = Math.min(100, this.nitroFuel + this.nitroRechargeRate * dt);
    }
  }

  updateTraction(throttle, steering, handbrake, dt) {
    const speed = this.velocity.length();
    const maxSpeed = 70;
    const adjustedMaxSpeed = this.nitroActive ? maxSpeed * this.nitroTopSpeedMult : maxSpeed;

    let tractionForce = 0;
    if (this.groundContact && this.currentGear !== 0) {
      const maxTraction = this.mass * 9.81 * this.staticFriction;
      const powerOutput = this.enginePower * 1000 * Math.abs(throttle);
      const nitroMult = this.nitroActive ? this.nitroPowerMult : 1.0;

      tractionForce = (powerOutput * nitroMult) / Math.max(1, speed);
      tractionForce = Math.min(tractionForce, maxTraction);

      if (this.currentGear === 1) tractionForce *= 1.3;
      else if (this.currentGear === 5) tractionForce *= 0.7;

      if (this.currentGear === 0) tractionForce *= -0.6;
      else if (throttle < 0) tractionForce *= -0.8;
    }

    let dragForce = speed * speed * this.dragCoeff * 0.3;
    let rollingResistance = speed * this.rollResistance;

    if (throttle < 0 || handbrake) {
      dragForce += this.brakeTorque / this.wheelRadius * 0.5;
    }

    const netForce = tractionForce - dragForce - rollingResistance;
    const acceleration = netForce / this.mass;

    const forward = new THREE.Vector3(
      Math.sin(this.yaw),
      0,
      Math.cos(this.yaw)
    );

    forward.multiplyScalar(acceleration * dt);
    this.velocity.add(forward);

    if (this.velocity.length() > adjustedMaxSpeed) {
      this.velocity.normalize().multiplyScalar(adjustedMaxSpeed);
    }
  }

  updateDrift(steering, dt) {
    const speed = this.velocity.length();
    const sideways = new THREE.Vector3(
      Math.cos(this.yaw),
      0,
      -Math.sin(this.yaw)
    );

    const lateralVelocity = this.velocity.dot(sideways);
    const slipAngle = Math.atan2(lateralVelocity, Math.max(speed, 1));

    const exceedsDriftThreshold = Math.abs(slipAngle) > this.driftThreshold;
    const driftSpeed = speed > this.driftMinSpeed;

    if ((exceedsDriftThreshold && driftSpeed) || this.isDrifting) {
      this.isDrifting = true;
      this.driftAngle = slipAngle;

      const driftIntensity = Math.abs(slipAngle) / Math.PI;
      this.driftPoints += driftIntensity * 10 * dt;
      this.driftMultiplier = 1.0 + Math.min(driftIntensity * 0.5, 0.3);
    } else {
      this.isDrifting = false;
      this.driftPoints = 0;
      this.driftMultiplier = 1.0;
    }

    if (speed < this.driftMinSpeed * 0.5) {
      this.isDrifting = false;
    }
  }

  updateSteering(steering, dt) {
    const speed = this.velocity.length();
    const steeringResponsiveness = 0.12;

    let steeringEffect = steeringResponsiveness * steering;
    steeringEffect *= Math.max(0.3, 1 - speed / 100);

    this.angularVelocity.y = this.angularVelocity.y * 0.85 + steeringEffect * speed * 0.08 * dt;
    this.yaw += this.angularVelocity.y * dt;

    this.yaw = ((this.yaw + Math.PI) % (2 * Math.PI)) - Math.PI;

    const forward = new THREE.Vector3(
      Math.sin(this.yaw),
      0,
      Math.cos(this.yaw)
    );

    const forwardSpeed = this.velocity.dot(forward);
    const targetVelocity = forward.multiplyScalar(forwardSpeed);

    const blendFactor = Math.min(0.1 * dt * speed, 0.2);
    this.velocity.lerp(targetVelocity, blendFactor);
  }

  updateWeightTransfer(throttle, steering, dt) {
    const accelForward = throttle * 15;
    const accelLateral = steering * this.velocity.length() * 0.15;

    const pitchAccel = -accelForward * this.pitchSensitivity;
    this.angularVelocity.x = this.angularVelocity.x * 0.92 + pitchAccel * 0.08;
    const currentPitch = this.chassisRoot.rotation.x || 0;
    this.chassisRoot.rotation.x = currentPitch * 0.95 + this.angularVelocity.x * dt * 0.1;
    this.chassisRoot.rotation.x = Math.max(-0.3, Math.min(0.3, this.chassisRoot.rotation.x));

    const rollAccel = accelLateral * this.rollSensitivity * (this.velocity.length() / 30);
    this.angularVelocity.z = this.angularVelocity.z * 0.92 + rollAccel * 0.08;
    const currentRoll = this.chassisRoot.rotation.z || 0;
    this.chassisRoot.rotation.z = currentRoll * 0.95 + this.angularVelocity.z * dt * 0.1;
    this.chassisRoot.rotation.z = Math.max(-0.25, Math.min(0.25, this.chassisRoot.rotation.z));
  }

  updatePosition(dt) {
    this.position.add(this.velocity.clone().multiplyScalar(dt));
  }

  checkRoadBoundaries() {
    const offset = this.getRoadOffset(this.position.z);
    const boundaryX_Min = offset.x - this.roadWidth / 2;
    const boundaryX_Max = offset.x + this.roadWidth / 2;

    if (this.position.x < boundaryX_Min) {
      this.position.x = boundaryX_Min + 0.2;
      this.velocity.x = -this.velocity.x * 0.3;
    } else if (this.position.x > boundaryX_Max) {
      this.position.x = boundaryX_Max - 0.2;
      this.velocity.x = -this.velocity.x * 0.3;
    }
  }

  syncToThreeJS() {
    this.vehicleRoot.position.copy(this.position);
    this.vehicleRoot.rotation.order = 'YXZ';
    this.vehicleRoot.rotation.y = this.yaw;
  }

  getTelemetry() {
    const speed = this.velocity.length();
    const speedKmh = speed * 3.6;

    return {
      speed,
      speedKmh,
      position: this.position.clone(),
      velocity: this.velocity.clone(),
      yaw: this.yaw,
      rpm: Math.round(this.rpm),
      currentGear: this.currentGear === 0 ? 'R' : this.currentGear,
      rpmRatio: this.rpm / 7000,
      nitroFuel: Math.round(this.nitroFuel),
      nitroActive: this.nitroActive,
      isDrifting: this.isDrifting,
      driftAngle: this.driftAngle * (180 / Math.PI),
      driftPoints: Math.round(this.driftPoints),
      driftMultiplier: this.driftMultiplier.toFixed(2),
      groundContact: this.groundContact,
      airborneTime: this.airborneTime.toFixed(2),
      collisions: this.collisionEvents.splice(0)
    };
  }

  reset(x = 0, y = 0, z = 0, yaw = 0) {
    this.position.set(x, y, z);
    this.velocity.set(0, 0, 0);
    this.angularVelocity.set(0, 0, 0);
    this.yaw = yaw;
    this.currentGear = 1;
    this.rpm = 0;
    this.isDrifting = false;
    this.driftAngle = 0;
    this.driftPoints = 0;
    this.nitroFuel = 100;
    this.nitroActive = false;
    this.airborneTime = 0;

    this.vehicleRoot.position.copy(this.position);
    this.vehicleRoot.rotation.y = this.yaw;
    this.chassisRoot.rotation.set(0, 0, 0);
  }
}

    <!-- Main Game -->
    <script>
class StreetRacerV1 {
  constructor() {
    // === THREE.JS SETUP ===
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x87ceeb);
    this.scene.fog = new THREE.Fog(0x87ceeb, 600, 1200);

    this.camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      2000
    );

    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFShadowShadowMap;
    this.renderer.shadowMap.mapSize.width = 4096;
    this.renderer.shadowMap.mapSize.height = 4096;
    document.body.appendChild(this.renderer.domElement);

    // === LIGHTING ===
    this.setupLighting();

    // === WORLD ===
    this.worldScale = 1000;
    this.createWorld();

    // === PLAYER VEHICLE ===
    this.createPlayerVehicle();

    // === NPC VEHICLES ===
    this.npcVehicles = [];
    this.createNPCVehicles();

    // === GAME STATE ===
    this.gameMode = 'freeroam'; // freeroam, race, drift, timetrial
    this.raceActive = false;
    this.raceStartTime = 0;
    this.raceBestTime = Infinity;
    this.checkpoints = [];
    this.currentCheckpoint = 0;
    this.driftScore = 0;

    // === INPUT ===
    this.input = { throttle: 0, steering: 0, handbrake: false, nos: false };
    this.setupInputHandlers();

    // === PARTICLES ===
    this.sparkParticles = [];
    this.skidMarks = [];

    // === TIMING ===
    this.clock = new THREE.Clock();

    // === MINIMAP ===
    this.createMinimap();

    // === EVENT LISTENERS ===
    window.addEventListener('resize', () => this.onWindowResize());

    // === INITIAL STATE ===
    this.setupRaceCheckpoints();
  }

  setupLighting() {
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    this.scene.add(ambientLight);

    // Main sun
    this.sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
    this.sunLight.position.set(500, 400, 500);
    this.sunLight.castShadow = true;
    this.sunLight.shadow.mapSize.width = 4096;
    this.sunLight.shadow.mapSize.height = 4096;
    this.sunLight.shadow.camera.far = 1500;
    this.sunLight.shadow.camera.left = -800;
    this.sunLight.shadow.camera.right = 800;
    this.sunLight.shadow.camera.top = 800;
    this.sunLight.shadow.camera.bottom = -800;
    this.sunLight.shadow.bias = -0.001;
    this.scene.add(this.sunLight);

    // Hemisphere light for better colors
    const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x2d5016, 0.3);
    this.scene.add(hemiLight);
  }

  createWorld() {
    // === TERRAIN WITH HEIGHT MAP ===
    const terrainGeom = new THREE.PlaneGeometry(1000, 1000, 128, 128);
    const terrainMat = new THREE.MeshStandardMaterial({
      color: 0x2d5016,
      roughness: 0.9,
      metalness: 0.0
    });

    // Modify terrain with sine waves for rolling hills
    const positions = terrainGeom.attributes.position;
    for (let i = 0; i < positions.count; i++) {
      const x = positions.getX(i);
      const z = positions.getZ(i);
      
      // Rolling hills
      const height = Math.sin(x * 0.005) * 8 + Math.sin(z * 0.006) * 6 + Math.sin(x * 0.001 + z * 0.002) * 4;
      positions.setY(i, height);
    }
    positions.needsUpdate = true;
    terrainGeom.computeVertexNormals();

    const terrain = new THREE.Mesh(terrainGeom, terrainMat);
    terrain.receiveShadow = true;
    terrain.rotation.x = -Math.PI / 2;
    terrain.position.z = 0;
    this.scene.add(terrain);

    this.terrainGeom = terrainGeom;

    // === ROADS ===
    this.createRoads();

    // === BUILDINGS & PROPS ===
    this.createCity();
    this.createForest();
  }

  createRoads() {
    // Main road through map
    const roadMat = new THREE.MeshStandardMaterial({
      color: 0x333333,
      roughness: 0.4,
      metalness: 0.1
    });

    // Horizontal main road
    const mainRoad1 = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 1000),
      roadMat
    );
    mainRoad1.rotation.x = -Math.PI / 2;
    mainRoad1.position.z = 0;
    mainRoad1.position.y = 0.02;
    mainRoad1.castShadow = false;
    mainRoad1.receiveShadow = true;
    this.scene.add(mainRoad1);

    // Vertical road
    const mainRoad2 = new THREE.Mesh(
      new THREE.PlaneGeometry(150, 800),
      roadMat
    );
    mainRoad2.rotation.x = -Math.PI / 2;
    mainRoad2.position.x = 150;
    mainRoad2.position.z = 0;
    mainRoad2.position.y = 0.02;
    mainRoad2.castShadow = false;
    mainRoad2.receiveShadow = true;
    this.scene.add(mainRoad2);

    // Curved scenic road
    const curveRoad = new THREE.Mesh(
      new THREE.PlaneGeometry(120, 600),
      roadMat
    );
    curveRoad.rotation.x = -Math.PI / 2;
    curveRoad.rotation.z = 0.3;
    curveRoad.position.x = -250;
    curveRoad.position.z = 200;
    curveRoad.position.y = 0.02;
    curveRoad.castShadow = false;
    curveRoad.receiveShadow = true;
    this.scene.add(curveRoad);

    // === ROAD BOUNDARIES ===
    const boundaryMat = new THREE.MeshStandardMaterial({
      color: 0xff8800,
      roughness: 0.7
    });

    const boundaryGeom = new THREE.BoxGeometry(0.5, 0.8, 1000);
    
    // Main road boundaries
    const bound1 = new THREE.Mesh(boundaryGeom, boundaryMat);
    bound1.position.set(100, 0.4, 0);
    bound1.castShadow = true;
    this.scene.add(bound1);

    const bound2 = new THREE.Mesh(boundaryGeom, boundaryMat);
    bound2.position.set(-100, 0.4, 0);
    bound2.castShadow = true;
    this.scene.add(bound2);

    // Road markings (dashed lines)
    const lineGeom = new THREE.PlaneGeometry(0.2, 8);
    const lineMat = new THREE.MeshStandardMaterial({ color: 0xffff00 });
    
    for (let z = -500; z < 500; z += 20) {
      const line = new THREE.Mesh(lineGeom, lineMat);
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, 0.03, z);
      this.scene.add(line);
    }
  }

  createCity() {
    const buildingMat = new THREE.MeshStandardMaterial({
      color: 0x666666,
      roughness: 0.6,
      metalness: 0.2
    });

    const windowMat = new THREE.MeshStandardMaterial({
      color: 0xffff00,
      emissive: 0xffff00,
      emissiveIntensity: 0.3
    });

    // Create building clusters
    const buildingPositions = [
      { x: 200, z: 150, w: 30, h: 40, d: 25 },
      { x: 250, z: 200, w: 35, h: 35, d: 30 },
      { x: 180, z: 80, w: 25, h: 50, d: 20 },
      { x: 300, z: 120, w: 40, h: 30, d: 35 },
      { x: -150, z: 100, w: 30, h: 45, d: 25 },
      { x: -200, z: 180, w: 35, h: 35, d: 30 },
      { x: -100, z: 50, w: 40, h: 40, d: 35 }
    ];

    buildingPositions.forEach(pos => {
      const building = new THREE.Mesh(
        new THREE.BoxGeometry(pos.w, pos.h, pos.d),
        buildingMat
      );
      building.position.set(pos.x, pos.h / 2, pos.z);
      building.castShadow = true;
      building.receiveShadow = true;
      this.scene.add(building);

      // Windows
      for (let i = 0; i < Math.floor(pos.h / 5); i++) {
        for (let j = 0; j < 2; j++) {
          const window = new THREE.Mesh(
            new THREE.BoxGeometry(2, 2, 0.5),
            windowMat
          );
          window.position.set(
            pos.x + (j === 0 ? -pos.w / 4 : pos.w / 4),
            3 + i * 5,
            pos.z + pos.d / 2 + 0.1
          );
          this.scene.add(window);
        }
      }
    });
  }

  createForest() {
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
    const foliageMat = new THREE.MeshStandardMaterial({ color: 0x228b22 });

    const treePositions = [
      { x: -300, z: -300 }, { x: -280, z: -250 }, { x: -320, z: -280 },
      { x: 350, z: -300 }, { x: 380, z: -280 }, { x: 330, z: -250 },
      { x: -400, z: 300 }, { x: -380, z: 330 },
      { x: 450, z: 350 }, { x: 480, z: 380 }
    ];

    treePositions.forEach(pos => {
      // Trunk
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.2, 10, 8), trunkMat);
      trunk.position.set(pos.x, 5, pos.z);
      trunk.castShadow = true;
      this.scene.add(trunk);

      // Foliage (cone)
      const foliage = new THREE.Mesh(new THREE.ConeGeometry(6, 12, 16), foliageMat);
      foliage.position.set(pos.x, 14, pos.z);
      foliage.castShadow = true;
      this.scene.add(foliage);
    });
  }

  createPlayerVehicle() {
    this.playerVehicleRoot = new THREE.Group();
    this.scene.add(this.playerVehicleRoot);

    this.playerChassisRoot = new THREE.Group();
    this.playerVehicleRoot.add(this.playerChassisRoot);

    // Car body
    const carGeom = new THREE.BoxGeometry(1.8, 1.2, 4.3);
    const carMat = new THREE.MeshStandardMaterial({
      color: 0xff0000,
      metalness: 0.7,
      roughness: 0.2
    });
    const carBody = new THREE.Mesh(carGeom, carMat);
    carBody.position.y = 0.6;
    carBody.castShadow = true;
    carBody.receiveShadow = true;
    this.playerChassisRoot.add(carBody);

    // Wheels
    const wheelGeom = new THREE.CylinderGeometry(0.34, 0.34, 0.3, 16);
    const wheelMat = new THREE.MeshStandardMaterial({
      color: 0x222222,
      roughness: 0.8
    });

    const wheelPositions = [
      [-0.9, -2.15], [0.9, -2.15],
      [-0.9, 2.15], [0.9, 2.15]
    ];

    wheelPositions.forEach(([x, z]) => {
      const wheel = new THREE.Mesh(wheelGeom, wheelMat);
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(x, 0.34, z);
      wheel.castShadow = true;
      this.playerChassisRoot.add(wheel);
    });

    // Physics
    this.playerPhysics = new VehiclePhysics(this.playerVehicleRoot, this.playerChassisRoot, {
      mass: 1300,
      dragCoeff: 0.95,
      suspensionK: 25000,
      suspensionC: 2500,
      getGroundHeight: (x, z) => this.getTerrainHeight(x, z),
      getRoadOffset: (z) => ({ x: 0 }),
      roadWidth: 200
    });

    this.playerPhysics.reset(0, 30, 0, 0);
  }

  createNPCVehicles() {
    const npcConfigs = [
      { x: 0, z: 100, color: 0x0000ff },
      { x: -50, z: 200, color: 0xffff00 },
      { x: 50, z: 50, color: 0x00ff00 }
    ];

    npcConfigs.forEach(config => {
      const root = new THREE.Group();
      const chassis = new THREE.Group();
      root.add(chassis);
      this.scene.add(root);

      // Body
      const carGeom = new THREE.BoxGeometry(1.8, 1.2, 4.3);
      const carMat = new THREE.MeshStandardMaterial({
        color: config.color,
        metalness: 0.6,
        roughness: 0.3
      });
      const body = new THREE.Mesh(carGeom, carMat);
      body.position.y = 0.6;
      body.castShadow = true;
      chassis.add(body);

      // Wheels
      const wheelGeom = new THREE.CylinderGeometry(0.34, 0.34, 0.3, 16);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

      [[-0.9, -2.15], [0.9, -2.15], [-0.9, 2.15], [0.9, 2.15]].forEach(([x, z]) => {
        const wheel = new THREE.Mesh(wheelGeom, wheelMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(x, 0.34, z);
        wheel.castShadow = true;
        chassis.add(wheel);
      });

      const physics = new VehiclePhysics(root, chassis, {
        mass: 1300,
        dragCoeff: 0.95,
        getGroundHeight: (x, z) => this.getTerrainHeight(x, z),
        getRoadOffset: (z) => ({ x: 0 }),
        roadWidth: 200
      });

      physics.reset(config.x, 30, config.z, 0);

      this.npcVehicles.push({
        root, chassis, physics,
        pathT: 0,
        speed: 15 + Math.random() * 10
      });
    });
  }

  getTerrainHeight(x, z) {
    // Terrain height calculation
    const height = Math.sin(x * 0.005) * 8 + Math.sin(z * 0.006) * 6 + Math.sin(x * 0.001 + z * 0.002) * 4;
    return height;
  }

  setupRaceCheckpoints() {
    // Create checkpoint markers
    this.checkpoints = [
      { x: 0, z: 0, radius: 50 },
      { x: 100, z: 100, radius: 50 },
      { x: 200, z: 0, radius: 50 },
      { x: 100, z: -150, radius: 50 },
      { x: 0, z: 0, radius: 50 }
    ];

    // Visualize checkpoints (debug circles)
    const checkpointMat = new THREE.MeshStandardMaterial({
      color: 0x00ff00,
      emissive: 0x00ff00,
      emissiveIntensity: 0.5,
      transparent: true,
      opacity: 0.3
    });

    this.checkpoints.forEach(cp => {
      const circle = new THREE.Mesh(
        new THREE.CylinderGeometry(cp.radius, cp.radius, 0.5, 32),
        checkpointMat
      );
      circle.position.set(cp.x, this.getTerrainHeight(cp.x, cp.z) + 2, cp.z);
      this.scene.add(circle);
    });
  }

  setupInputHandlers() {
    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      
      if (e.key === 'r' || e.key === 'R') {
        this.playerPhysics.reset(0, 30, 0, 0);
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    this.getInput = () => {
      const w = keys['w'] || keys['arrowup'];
      const s = keys['s'] || keys['arrowdown'];
      const a = keys['a'] || keys['arrowleft'];
      const d = keys['d'] || keys['arrowright'];
      const space = keys[' '];
      const shift = keys['shift'];

      if (w && !s) this.input.throttle = 1;
      else if (s && !w) this.input.throttle = -0.5;
      else this.input.throttle = 0;

      if (a && !d) this.input.steering = -1;
      else if (d && !a) this.input.steering = 1;
      else this.input.steering = 0;

      this.input.handbrake = space;
      this.input.nos = shift;
    };
  }

  createMinimap() {
    const canvas = document.getElementById('minimapCanvas');
    this.minimapCtx = canvas.getContext('2d');
    canvas.width = 180;
    canvas.height = 180;
  }

  updateMinimap() {
    const ctx = this.minimapCtx;
    const scale = 0.15; // 0.15 px per meter

    // Clear
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, 0, 180, 180);

    // Grid
    ctx.strokeStyle = '#003300';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 180; i += 30) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      ctx.lineTo(i, 180);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i);
      ctx.lineTo(180, i);
      ctx.stroke();
    }

    // Draw checkpoints
    ctx.fillStyle = '#00ff00';
    this.checkpoints.forEach(cp => {
      const x = 90 + cp.x * scale;
      const y = 90 - cp.z * scale;
      ctx.fillRect(x - 2, y - 2, 4, 4);
    });

    // Draw NPCs
    ctx.fillStyle = '#0088ff';
    this.npcVehicles.forEach(npc => {
      const x = 90 + npc.physics.position.x * scale;
      const y = 90 - npc.physics.position.z * scale;
      ctx.fillRect(x - 2, y - 2, 4, 4);
    });

    // Draw player
    ctx.fillStyle = '#ff0000';
    const px = 90 + this.playerPhysics.position.x * scale;
    const py = 90 - this.playerPhysics.position.z * scale;
    ctx.beginPath();
    ctx.arc(px, py, 4, 0, Math.PI * 2);
    ctx.fill();

    // Direction indicator
    const yaw = this.playerPhysics.yaw;
    ctx.strokeStyle = '#ff0000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + Math.sin(yaw) * 8, py - Math.cos(yaw) * 8);
    ctx.stroke();
  }

  updateHUD() {
    const telemetry = this.playerPhysics.getTelemetry();
    const hud = document.getElementById('hud');

    let text = `STREET RACER V1
━━━━━━━━━━━━━━━━━━━━━
Speed: ${telemetry.speedKmh.toFixed(1)} km/h
Gear: ${telemetry.currentGear}
RPM: ${telemetry.rpm}

Nitro: ${telemetry.nitroFuel.toFixed(0)}% ${telemetry.nitroActive ? '🔥' : ''}

Drift: ${telemetry.isDrifting ? 'YES ✓' : 'no'}
Points: ${telemetry.driftPoints}

Mode: ${this.gameMode.toUpperCase()}`;

    if (this.raceActive) {
      const elapsed = (Date.now() - this.raceStartTime) / 1000;
      text += `\n\nRACE TIME: ${elapsed.toFixed(2)}s
CP: ${this.currentCheckpoint + 1}/${this.checkpoints.length}`;
    }

    hud.textContent = text;
  }

  updateSpeedometer() {
    const telemetry = this.playerPhysics.getTelemetry();
    const speedometer = document.getElementById('speedometer');
    
    const speed = Math.min(telemetry.speedKmh, 320);
    const speedPercent = (speed / 320) * 100;
    const barLength = Math.floor(speedPercent / 5);

    speedometer.innerHTML = `
SPEED: ${telemetry.speedKmh.toFixed(0)} km/h
${'█'.repeat(barLength)}${'░'.repeat(20 - barLength)}
    `;
  }

  updateRaceTimer() {
    if (!this.raceActive) {
      document.getElementById('raceTimer').style.display = 'none';
      return;
    }

    const elapsed = (Date.now() - this.raceStartTime) / 1000;
    const timerEl = document.getElementById('raceTimer');
    timerEl.style.display = 'block';
    timerEl.textContent = `${elapsed.toFixed(2)}s`;
  }

  updateNPCVehicles(dt) {
    this.npcVehicles.forEach(npc => {
      // Simple waypoint following
      npc.pathT += dt * 0.05;
      if (npc.pathT > 1) npc.pathT = 0;

      const t = npc.pathT;
      const waypoints = [
        { x: 0, z: 100 },
        { x: 100, z: 100 },
        { x: 200, z: 0 },
        { x: 100, z: -150 }
      ];

      const current = waypoints[Math.floor(t * waypoints.length)];
      const next = waypoints[(Math.floor(t * waypoints.length) + 1) % waypoints.length];

      const direction = new THREE.Vector3(next.x - current.x, 0, next.z - current.z).normalize();
      const steeringAngle = Math.atan2(direction.x, direction.z) - npc.physics.yaw;

      const normalizedSteering = Math.max(-1, Math.min(1, steeringAngle * 2));

      npc.physics.update(dt, {
        throttle: 0.6,
        steering: normalizedSteering,
        handbrake: false,
        nos: false
      });
    });
  }

  checkRaceCheckpoints() {
    if (!this.raceActive) return;

    const playerPos = this.playerPhysics.position;
    const currentCP = this.checkpoints[this.currentCheckpoint];

    const dist = Math.sqrt(
      Math.pow(playerPos.x - currentCP.x, 2) +
      Math.pow(playerPos.z - currentCP.z, 2)
    );

    if (dist < currentCP.radius) {
      this.currentCheckpoint++;

      if (this.currentCheckpoint >= this.checkpoints.length) {
        // Lap complete!
        const lapTime = (Date.now() - this.raceStartTime) / 1000;
        
        if (lapTime < this.raceBestTime) {
          this.raceBestTime = lapTime;
        }

        this.showRaceComplete(lapTime);
        this.raceActive = false;
      }
    }
  }

  showRaceComplete(time) {
    const statusEl = document.getElementById('gameStatus');
    const titleEl = document.getElementById('statusTitle');
    const textEl = document.getElementById('statusText');

    titleEl.textContent = 'LAP COMPLETE!';
    textEl.innerHTML = `
      Time: ${time.toFixed(2)}s<br>
      Best: ${this.raceBestTime.toFixed(2)}s<br>
      <br>
      <button onclick="location.reload()" style="background: #0f0; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold;">RACE AGAIN</button>
    `;

    statusEl.style.display = 'block';

    setTimeout(() => {
      statusEl.style.display = 'none';
      this.raceActive = false;
      this.currentCheckpoint = 0;
    }, 5000);
  }

  setupModeButtons() {
    document.getElementById('modeFreeroam').onclick = () => {
      this.gameMode = 'freeroam';
      this.raceActive = false;
      this.currentCheckpoint = 0;
      document.querySelectorAll('#modeSelector button').forEach(b => b.classList.remove('active'));
      document.getElementById('modeFreeroam').classList.add('active');
    };

    document.getElementById('modeRace').onclick = () => {
      this.gameMode = 'race';
      this.raceActive = true;
      this.raceStartTime = Date.now();
      this.currentCheckpoint = 0;
      document.querySelectorAll('#modeSelector button').forEach(b => b.classList.remove('active'));
      document.getElementById('modeRace').classList.add('active');
    };

    document.getElementById('modeDrift').onclick = () => {
      this.gameMode = 'drift';
      this.raceActive = false;
      document.querySelectorAll('#modeSelector button').forEach(b => b.classList.remove('active'));
      document.getElementById('modeDrift').classList.add('active');
    };

    document.getElementById('modeTimeTrial').onclick = () => {
      this.gameMode = 'timetrial';
      this.raceActive = true;
      this.raceStartTime = Date.now();
      this.currentCheckpoint = 0;
      document.querySelectorAll('#modeSelector button').forEach(b => b.classList.remove('active'));
      document.getElementById('modeTimeTrial').classList.add('active');
    };
  }

  updateCamera() {
    const physics = this.playerPhysics;
    const cameraDistance = 10;
    const cameraHeight = 4;

    const behindDir = new THREE.Vector3(
      -Math.sin(physics.yaw) * cameraDistance,
      cameraHeight,
      -Math.cos(physics.yaw) * cameraDistance
    );

    const targetPos = physics.position.clone().add(behindDir);
    this.camera.position.lerp(targetPos, 0.12);

    const lookTarget = physics.position.clone();
    lookTarget.y += 1.5;
    this.camera.lookAt(lookTarget);
  }

  onWindowResize() {
    this.camera.aspect = window.innerWidth / window.innerHeight;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(window.innerWidth, window.innerHeight);
  }

  animate() {
    requestAnimationFrame(() => this.animate());

    const dt = Math.min(0.016, this.clock.getDelta());

    // Input
    this.getInput();

    // Physics
    this.playerPhysics.update(dt, this.input);
    this.updateNPCVehicles(dt);

    // Game logic
    if (this.gameMode === 'race' || this.gameMode === 'timetrial') {
      this.checkRaceCheckpoints();
    }

    // Camera
    this.updateCamera();

    // UI
    this.updateHUD();
    this.updateSpeedometer();
    this.updateRaceTimer();
    this.updateMinimap();

    // Render
    this.renderer.render(this.scene, this.camera);
  }

  start() {
    this.setupModeButtons();
    this.animate();
  }
}

// === MAIN ===
window.addEventListener('DOMContentLoaded', () => {
  const game = new StreetRacerV1();
  game.start();
});
    </script>
</body>
